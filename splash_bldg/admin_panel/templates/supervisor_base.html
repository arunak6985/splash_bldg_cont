{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>{% block title %}Supervisor Panel - Splash Building Contractors{% endblock %}</title>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  
  {% include 'admin_styles.html' %}
</head>

<body>
  <div class="admin-container">
    <!-- Supervisor Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">S</div>
        <div class="logo-text">Supervisor Panel</div>
      </div>
      
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">Main</div>
          <div class="nav-item">
            <a href="{% url 'supervisor_dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'supervisor_dashboard' %}active{% endif %}">
              <i class="nav-icon bi bi-calendar-check"></i>
              <span class="nav-text">Attendance</span>
            </a>
          </div>
        </div>

        <div class="nav-section">
          <div class="nav-section-title">Other</div>
          <div class="nav-item">
            <a href="{% url 'admin_logout' %}" class="nav-link">
              <i class="nav-icon bi bi-box-arrow-right"></i>
              <span class="nav-text">Logout</span>
            </a>
          </div>
        </div>
      </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      {% include 'admin_header.html' %}

      <!-- Content Area -->
      <div class="content-area">
        {% block content %}
        {% endblock %}
      </div>
    </div>
  </div>

  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('collapsed');
    }

    // Auto-collapse sidebar on mobile
    if (window.innerWidth <= 768) {
      document.getElementById('sidebar').classList.add('collapsed');
    }
  </script>
  
  {% block extra_js %}
  {% endblock %}
</body>
</html>
